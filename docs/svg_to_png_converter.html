            background-color: #f5f5f5;
        }
        .container {
            background: white;

            border-radius: 8px;
            background: #fafafa;
        }
        
        .state-section h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
            border-bottom: 2px solid #4A90E2;
            padding-bottom: 5px;
        }
        
        .icons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        .icon-container {
            text-align: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            min-width: 100px;
        }
        
        .icon {
            margin-bottom: 10px;
        }
        .icon-preview {
            margin-bottom: 10px;
        }
        .icon-label {
            font-weight: bold;
            color: #333;
            margin: 5px 0;
        }
        .download-btn {
            background: #007cba;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background: #005a87;
        }
        .batch-download {
            text-align: center;
            margin-top: 30px;
        }
        .batch-btn {
            background: #5CB85C;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 10px;
        }
        .batch-btn:hover {
            background: #449D44;
        }
        .instructions {
            background: #e8f4fd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4A90E2;
        }
        .file-structure {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 15px;

        // SVG转PNG函数
        function svgToPng(svgString, size, callback) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            canvas.width = size;
            canvas.height = size;
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                callback(canvas.toDataURL('image/png'));
            };
            
            const svgBlob = new Blob([svgString], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(svgBlob);
            img.src = url;
        }

        // 下载文件函数
        function downloadFile(dataUrl, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 下载单个图标
        function downloadIcon(state, size) {
            const svgString = iconData[state][size];
            svgToPng(svgString, parseInt(size), function(dataUrl) {
                downloadFile(dataUrl, `icon-${state}-${size}.png`);
            });
        }

        // 批量下载默认状态图标
        function downloadAllDefault() {
            ['16', '32', '48', '128'].forEach(size => {
                setTimeout(() => downloadIcon('default', size), 100 * parseInt(size) / 16);
            });
        }

        // 批量下载激活状态图标
        function downloadAllActive() {
            ['16', '32', '48', '128'].forEach(size => {
                setTimeout(() => downloadIcon('active', size), 100 * parseInt(size) / 16);
            });
        }

        // 批量下载部分启用状态图标
        function downloadAllPartial() {
            ['16', '32', '48', '128'].forEach(size => {
                setTimeout(() => downloadIcon('partial', size), 100 * parseInt(size) / 16);
            });
        }

        // 批量下载完全禁用状态图标
        function downloadAllInactive() {
            ['16', '32', '48', '128'].forEach(size => {
                setTimeout(() => downloadIcon('inactive', size), 100 * parseInt(size) / 16);
            });
        }

        // 生成图标网格
        function generateIconGrid() {
            const grid = document.getElementById('iconGrid');
            grid.innerHTML = '';
            
            const states = ['default', 'active', 'partial', 'inactive'];
            const stateNames = {
                'default': '默认状态',
                'active': '激活状态',
                'partial': '部分启用状态',
                'inactive': '完全禁用状态'
            };
            const sizes = ['16', '32', '48', '128'];
            
            states.forEach(state => {
                const stateDiv = document.createElement('div');
                stateDiv.className = 'state-section';
                
                const stateTitle = document.createElement('h3');
                stateTitle.textContent = stateNames[state];
                stateDiv.appendChild(stateTitle);
                
                const iconsRow = document.createElement('div');
                iconsRow.className = 'icons-row';
                
                sizes.forEach(size => {
                    const iconContainer = document.createElement('div');
                    iconContainer.className = 'icon-container';
                    
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'icon';
                    iconDiv.innerHTML = iconData[state][size];
                    
                    const label = document.createElement('div');
                    label.className = 'icon-label';
                    label.textContent = `${size}x${size}`;
                    
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.textContent = '下载';
                    downloadBtn.onclick = () => downloadIcon(state, size);
                    
                    iconContainer.appendChild(iconDiv);
                    iconContainer.appendChild(label);
                    iconContainer.appendChild(downloadBtn);
                    iconsRow.appendChild(iconContainer);
                });
                
                stateDiv.appendChild(iconsRow);
                grid.appendChild(stateDiv);
            });
        }

        function downloadAllIcons() {
            const states = ['default', 'active', 'partial', 'inactive'];
            const sizes = ['16', '32', '48', '128'];
            let delay = 0;
            
            states.forEach(state => {
                sizes.forEach(size => {
                    setTimeout(() => downloadIcon(state, size), delay * 100);
                    delay++;
                });
            });
        }

        // 页面加载完成后生成图标网格
        window.onload = generateIconGrid;
    </script>
</body>
</html>
