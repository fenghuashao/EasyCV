<?xml version="1.0" encoding="UTF-8"?>
<svg width="1120" height="1020" viewBox="0 0 1120 1020" xmlns="http://www.w3.org/2000/svg" style="background-color: #F0F2F5;">
    <style>
        /* Global Styles */
        .title { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #333333; text-anchor: middle; }
        .main-text { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333333; text-anchor: middle; }
        .sub-text { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #666666; text-anchor: middle; }
        .btn-text { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 500; fill: white; text-anchor: middle; }
        .btn-text-dark { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #333333; text-anchor: middle; }
        .link-text { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #337AB7; text-anchor: middle; cursor: pointer; text-decoration: underline; }
        .icon { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 20px; fill: #555555; text-anchor: middle; cursor: pointer; }
        .placeholder-text { font-family: system-ui, -apple-system, 'Segoe UI', Arial,sans-serif; font-size: 12px; fill: #999999; }

        /* Icon Styles */
        .success-icon { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 48px; fill: #5CB85C; text-anchor: middle; }
        .warning-icon { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 42px; fill: #F0AD4E; text-anchor: middle; }
        .failure-icon { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 48px; fill: #555555; text-anchor: middle; }
        
        /* Settings Page Specific Styles (Merged) */
        .page-title { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #333333; }
        .section-title { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #333333; }
        .input-text { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #333333; }
        .delete-btn { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #C9302C; cursor: pointer; text-anchor: middle; }
        .tag { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 500; fill: white; text-anchor: middle; }
        .settings-link-text { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #337AB7; text-decoration: underline; cursor: pointer; }
        .checkbox-label { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #333333; cursor: pointer;}
        .checkmark { font-size: 14px; fill: #4A90E2; text-anchor: middle; font-weight: bold; }
    </style>
    
    <g id="popup-row">
        <g transform="translate(40, 40)">
            <text x="160" y="-15" class="title">1. 初始状态</text>
            <g class="popup-container">
                <rect width="320" height="200" rx="4" fill="#FDFDFD" stroke="#CCCCCC"/>
                <g transform="translate(60, 55)" style="cursor: pointer;">
                    <rect width="200" height="38" rx="4" ry="4" fill="#4A90E2"/>
                    <text x="100" y="24" class="btn-text">解锁复制</text>
                </g>
                <g transform="translate(60, 105)" style="cursor: pointer;">
                    <rect width="200" height="38" rx="4" ry="4" fill="#4A90E2"/>
                    <text x="100" y="24" class="btn-text">解锁粘贴</text>
                </g>
                <text x="295" y="185" class="icon" title="设置">⚙</text>
            </g>
        </g>
        
        <g transform="translate(400, 40)">
            <text x="160" y="-15" class="title">2. 解锁成功</text>
            <g class="popup-container">
                <rect width="320" height="200" rx="4" fill="#FDFDFD" stroke="#CCCCCC"/>
                <text x="160" y="80" class="success-icon">✓</text>
                <text x="160" y="115" class="main-text">搞定！现在可以复制了。</text>
                <g transform="translate(60, 140)" style="cursor: not-allowed;">
                    <rect width="200" height="38" rx="4" ry="4" fill="#CCCCCC"/>
                    <text x="100" y="24" class="btn-text">解锁粘贴</text>
                </g>
                <text x="295" y="185" class="icon" title="设置">⚙</text>
            </g>
        </g>
        
        <g transform="translate(760, 40)">
            <text x="160" y="-15" class="title">3. 强力模式提示</text>
            <g class="popup-container">
                <rect width="320" height="200" rx="4" fill="#FDFDFD" stroke="#CCCCCC"/>
                <text x="160" y="55" class="warning-icon">⚠</text>
                <text x="160" y="90" class="main-text">这个页面有点顽固，要试试强力模式吗？</text>
                <text x="160" y="110" class="sub-text">（注意：这会刷新当前页面）</text>
                <g transform="translate(40, 140)" style="cursor: pointer;">
                    <rect width="110" height="36" rx="4" ry="4" fill="#F0AD4E"/>
                    <text x="55" y="23" class="btn-text">刷新试试</text>
                </g>
                <g transform="translate(170, 140)" style="cursor: pointer;">
                    <rect width="110" height="36" rx="4" ry="4" fill="#EAEAEA" stroke="#CCCCCC" stroke-width="1"/>
                    <text x="55" y="23" class="btn-text-dark">算了</text>
                </g>
            </g>
        </g>
    </g>

    <g id="failure-row">
        <g transform="translate(40, 310)">
            <text x="160" y="-15" class="title">4. 解锁失败</text>
            <g class="popup-container">
                <rect width="320" height="200" rx="4" fill="#FDFDFD" stroke="#CCCCCC"/>
                <text x="160" y="80" class="failure-icon">🤷</text>
                <text x="160" y="115" class="main-text">抱歉，这个页面的“防御”太特殊，我尽力了。</text>
                <text x="160" y="155" class="link-text">报告此网站，帮助我们改进</text>
            </g>
        </g>
        
        <g transform="translate(400, 310)">
             <text x="160" y="-15" class="title">5. 用户反馈表单</text>
            <g class="popup-container">
                <rect width="320" height="240" rx="4" fill="#FDFDFD" stroke="#CCCCCC"/>
                <text x="160" y="60" class="failure-icon">🤷</text>
                <text x="160" y="95" class="main-text">抱歉，这个页面的“防御”太特殊，我尽力了。</text>
                <g transform="translate(40, 120)">
                    <rect width="240" height="60" rx="4" ry="4" fill="white" stroke="#CCCCCC" stroke-width="1"/>
                    <text x="10" y="20" class="placeholder-text">可以简单说下遇到的问题吗？（选填）</text>
                </g>
                <g transform="translate(100, 190)" style="cursor: pointer;">
                    <rect width="120" height="36" rx="4" ry="4" fill="#4A90E2"/>
                    <text x="60" y="23" class="btn-text">提交反馈</text>
                </g>
            </g>
        </g>
    </g>
    
    <g id="settings-row">
        <g transform="translate(40, 580)">
            <text x="240" y="-15" class="title">6. 设置页面 (已更新)</text>
            <g class="settings-container">
                <rect width="480" height="420" rx="4" fill="#FDFDFD" stroke="#CCCCCC"/>
                <text x="30" y="45" class="page-title">EasyCV 设置</text>
                <g transform="translate(30, 70)">
                    <rect width="420" height="70" rx="4" ry="4" fill="#F5F5F5" stroke="#E3E3E3"/>
                    <text x="15" y="28" class="main-text" text-anchor="start">
                        <tspan x="15">我们郑重承诺：绝不追踪您的浏览历史，</tspan>
                        <tspan x="15" dy="1.4em">绝不收集您的个人数据。您的信任高于一切。</tspan>
                    </text>
                    <text x="405" y="42" class="settings-link-text" text-anchor="end">查看开源代码</text>
                </g>
                <g transform="translate(30, 165)">
                    <text class="section-title">自动开启列表</text>
                    <text y="20" class="sub-text">在以下网站访问时，将自动为您开启指定功能。</text>
                    <g transform="translate(0, 40)">
                        <rect width="320" height="34" rx="4" ry="4" fill="white" stroke="#CCCCCC"/>
                        <text x="10" y="22" class="input-text" fill="#999">输入域名 (如 example.com)</text>
                        <g transform="translate(330, 0)" style="cursor: pointer;">
                            <rect width="90" height="34" rx="4" ry="4" fill="#4A90E2"/>
                            <text x="45" y="22" class="btn-text">添加</text>
                        </g>
                    </g>
                    <g transform="translate(0, 90)" class="checkbox-label">
                        <g transform="translate(0, 0)">
                            <rect x="0" y="-7" width="14" height="14" rx="2" fill="#E9F2FC" stroke="#4A90E2"/>
                            <text x="7" y="4" class="checkmark">✓</text>
                            <text x="22" y="5">仅解锁复制</text>
                        </g>
                        <g transform="translate(120, 0)">
                            <rect x="0" y="-7" width="14" height="14" rx="2" fill="white" stroke="#CCCCCC"/>
                            <text x="22" y="5">仅解锁粘贴</text>
                        </g>
                        <g transform="translate(240, 0)">
                            <rect x="0" y="-7" width="14" height="14" rx="2" fill="white" stroke="#CCCCCC"/>
                            <text x="22" y="5">全部解锁</text>
                        </g>
                    </g>
                    <g transform="translate(0, 125)" class="sub-text" style="font-weight: 500;">
                        <rect width="420" height="25" fill="#F0F0F0" rx="2"/>
                        <text x="15" y="17">网站域名</text><text x="250" y="17">自动设置</text><text x="370" y="17">操作</text>
                    </g>
                    <g transform="translate(0, 150)">
                        <rect width="420" height="40" fill="white" stroke="#EAEAEA" stroke-width="0 1 1 1"/>
                        <text x="15" y="25" class="input-text">developer.mozilla.org</text>
                        <g transform="translate(250, 10)"><rect width="60" height="20" rx="10" fill="#4A90E2" /><text x="30" y="14" class="tag">仅复制</text></g>
                        <text x="385" y="25" class="delete-btn" title="删除">🗑</text>
                    </g>
                    <g transform="translate(0, 190)">
                        <rect width="420" height="40" fill="white" stroke="#EAEAEA" stroke-width="0 1 1 1"/>
                        <text x="15" y="25" class="input-text">192.168.1.1</text>
                        <g transform="translate(250, 10)"><rect width="60" height="20" rx="10" fill="#5CB85C" /><text x="30" y="14" class="tag">全部解锁</text></g>
                        <text x="385" y="25" class="delete-btn" title="删除">🗑</text>
                    </g>
                </g>
            </g>
        </g>
    </g>
</svg>