<!doctype html><title>Paste mechanisms</title><script>document.addEventListener('paste',function(e){if(e.target.id==='listener')e.preventDefault()}); document.addEventListener('keydown',function(e){if(e.target.id==='keyboard'&&(e.metaKey||e.ctrlKey)&&e.key==='v')e.preventDefault()});</script><label>inline textarea<textarea id="inline" onpaste="return false"></textarea></label><label>inline input<input id="input" onpaste="return false"></label><label>listener textarea<textarea id="listener"></textarea></label><label>keyboard textarea<textarea id="keyboard"></textarea></label><label>plain<textarea id="plain"></textarea></label><div id="editable" contenteditable onpaste="return false"></div><script>window.triageEvents=[];document.addEventListener('paste',e=>{setTimeout(()=>triageEvents.push({id:e.target.id,isTrusted:e.isTrusted,defaultPrevented:e.defaultPrevented,time:performance.now()}),0)},true)</script>
